version: '3.3'
services:
  db4sci:
    image: sc-registry.fredhutch.org/db4sci:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - mydb_dbaas:/app/data
    networks:
      - sc-swarm-net
    deploy:
      restart_policy:
        condition: on-failure
      labels:
        - "org.fredhutch.app.owner=jfdey@fredhutch.org"
        - "org.fredhutch.github.repo=db4sci"
        - "traefik.enable=true"
        - "traefik.http.routers.db4sci.rule=Host(`db4sci.fredhutch.org`)"
        - "traefik.http.routers.db4sci-secured.rule=Host(`db4sci.fredhutch.org`)"
        - "traefik.http.routers.db4sci.entrypoints=web,web-secured"
        - "traefik.http.services.db4sci.loadbalancer.server.port=5008" # it seems you always need to give traefik a port so it 'notices' the service
        - "traefik.http.routers.db4sci.tls=true"

networks:
  sc-swarm-net:
    external: true

volumes:
  mydb_dbaas:
    driver: local
    driver_opts:
      type: nfs
      device: "${PERSISTENT_VOLUME_MYDB_DBAAS}"
      o: addr=${NFS_SERVER},rw
