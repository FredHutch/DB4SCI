
# MyDB Configuration Example
# Copy this file to mydb-config-ENV.yml and customize for your environment:
# cp mydb-config-example.yml mydb-config-ENV.yml
# (where ENV = dev or prod)


# =============================================================================
# Organization Information
# =============================================================================
# Customize messages, email, and contact information
# Used throughout the web interface and email notifications

organizationName: "My Organization"
supportOrganization: "My Department"
supportEmail: "support@my.org"
supportPerson: "Jane Q. Supportperson"
supportAdmin:
  - "admin@my.org"
backup_admin_mail:
  - "a-backup-admin@my.org"


# =============================================================================
# Branding - Logo and Favicon
# =============================================================================
# Path relative to mydb/static/ directory
# Replace with your organization's logo file

organizationLogo: "images/mylogo.svg"
organizationFavicon: "favicon.ico"
backup_purge_period: "30" # used in documentation.html



# =============================================================================
# Container Host Configuration
# =============================================================================
# Hostname and domain where MyDB and database containers run
# Users will connect to databases at: container_host.container_domain:PORT

container_host: "myhost"
container_domain: "my.org"
s3_prefix_prod: "mydb"
s3_prefix_prod: "mydb-dev"
s3_prefix_migrate: "prod"
# FQDN_host = container_host + "." + container_domain


# NFS configuration
# Docker volumes are backed by an NFS store. We need to know the
# name of the NFS host and the root path where volumes should be
# created.

# fully qualified host name:
NFS_HOST: "nfs-host.my.org"
# root path minus leading colon and trailing slash:
NFS_ROOT_PATH: "/mnt/volumes/db4sci"


# =============================================================================
# Active Directory / LDAP Authentication
# =============================================================================
# Configure your Active Directory server for user authentication
# The AD_auth.py module can be replaced with alternative authentication

ADServer: "dc.my.org"
ADDomain: "my.org"
ADSearchBase: "dc=my,dc=org"


# =============================================================================
# Application Settings
# =============================================================================

# Base port for database allocation (automatically increments from here)
base_port: 32010

# Docker configuration
docker: "/usr/bin/docker"
base_url: "unix://var/run/docker.sock"

# List of administrator usernames (AD usernames)
# Admins have access to /admin/* routes
admins:
  - "user1"
  - "user2"

# Timezone for container operations
#TZ = os.getenv("TZ", "America/Los_Angeles")
TZ: "America/Los_Angeles"

# AWS CLI path
aws: "aws"


# =============================================================================
# Directory Paths
# =============================================================================
# Application root directory
dbaas_path: "/opt/dbaas"

# Backup volume (shared across all database containers)
backupvol: "/mydb_admin/db_backups"

# =============================================================================
# Database Engine Configuration
# =============================================================================
# Configuration for each supported database type
# Images are listed in display order - first image is the default

info:
  Postgres:
    default_port: 5432
    backupdir: /var/lib/postgresql/backup
    mapped_volume: /var/lib/postgresql/data
    command: postgres
    service_user: postgres
    images:
      - - Postgres 17.4
        - "postgres:17.4"
      - - Postgres 13.2
        - "postgres:13.2"

  MariaDB:
    default_port: 3306
    command: mysqld
    service_user: root
    mapped_volume: /var/lib/mysql
    images:
      - - MariaDB 12.0.2
        - "mariadb:12.0.2"

  MongoDB:
    default_port: 27017
    pub_ports:
      - 27017
    backupdir: /var/backup
    mapped_volume: /data/db
    service_user: mongodb
    command: mongod
    dbengine: MongoDB
    images:
      - - MongoDB 8.2.2
        - "mongo:8.2.2"

# dbtypes = info.keys()
 

# =============================================================================
# Metadata Fields
# =============================================================================
# Metadata fields from version 1 of MyDB
# Used when creating container labels for database services

mydb_v1_meta_data:
  - "username"
  - "dbuser"
  - "image"
  - "description"
  - "department"
  - "manager"
  - "owner"
  - "contact"
  - "app_name"


# =============================================================================
# Log File Paths
# =============================================================================

backup_log: "/data/logs/backup.log"
admindb_log: "/data/logs/admindb.log"

# =============================================================================
# Database Admin Accounts
# =============================================================================
# For every database type, MyDB creates a privileged admin account
# used for backup operations. Set usernames and passwords here.
#
# SECURITY WARNING: These passwords should be strong and unique.
# In production, use Docker secrets or environment variables instead
# of hardcoding passwords in this file.

accounts:
  Postgres: 
    admin: "postgres_admin"
    admin_pass: "postgres_admin_password"
  MongoDB:
    admin: "mongo_admin"
    admin_pass: "mongo_admin_password"
  MariaDB:
    admin: "maria_admin"
    admin_pass: "maria_admin_password"
  # MyDB admin database credentials
  admindb:
    admin: "mydbadminuser"
    admin_pass: "admindbpassword"
    v1_admin_pass: "v1_admindbpassword"
    contact: "me@my.org"
    owner: "Jane Doe"
  # Test user credentials (used by test scripts)
  test_user:
    admin: "testusername"
    admin_pass: "testuserpassword"
    contact: "atestuser@my.org"
    owner: "Jane Tester"


# =============================================================================
# Email Configuration
# =============================================================================
# SMTP settings for sending email notifications

MAIL_FROM: "DB4SCI-noreply@my.org"
# MAIL_TO: os.getenv("supportAdmin")
MAIL_SERVER: "smtp.my.org"
